<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>paddle_pdf_ocr_v2 viewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <strong>paddle_pdf_ocr_v2</strong>
      <label>run <input id="run" value="extraction-smoke" /></label>
      <button id="load-run">Load</button>
      <button id="prev">←</button>
      <label>page <input id="page" type="number" min="1" value="13" /></label>
      <button id="next">→</button>
      <label><input id="show-paddle" type="checkbox" checked /> v2 Paddle</label>
      <label><input id="show-layout" type="checkbox" /> layout</label>
      <label><input id="show-cells" type="checkbox" /> cells</label>
      <span id="status"></span>
    </header>
    <main>
      <section id="document-pane">
        <div id="page-stage">
          <canvas id="pdf-canvas"></canvas>
          <svg id="overlay"></svg>
        </div>
      </section>
      <aside>
        <nav>
          <button data-panel="tokens" class="active">Tokens</button>
          <button data-panel="lines">Lines</button>
          <button data-panel="regions">Regions</button>
          <button data-panel="zones">Zones</button>
          <button data-panel="cells">Cells</button>
          <button data-panel="qa">QA</button>
          <button data-panel="manifest">Manifest</button>
          <button data-panel="raw">Raw</button>
        </nav>
        <div id="panel"></div>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
